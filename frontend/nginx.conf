server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml+rss application/json image/svg+xml;

    # $uri.html är raden som får apparna att fortsätta fungera. De länkar till
    # /privacy och /villkor utan filändelse -- i den gamla PWA:n var det
    # klientsideruttar, här är det privacy.html och villkor.html på disk. Utan
    # den här raden svarar de 404, och det märks först när en förälder trycker
    # på "Integritetspolicy" inne i appen.
    location / {
        try_files $uri $uri.html $uri/ =404;
        # Sitter här och inte i en ändelsematchning: apparna hämtar /privacy utan
        # ".html", och en regex på ändelsen matchar då ingenting alls -- de svaren
        # blev helt utan Cache-Control.
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    error_page 404 /404.html;

    # Bilderna är oföränderliga; HTML får inte cachas hårt eftersom villkor och
    # integritetspolicy måste kunna uppdateras och slå igenom.
    #
    # Cache-Control sätts bara med add_header och inte med expires. Båda skriver
    # samma huvud, och med båda skickade nginx det två gånger i samma svar.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

}
