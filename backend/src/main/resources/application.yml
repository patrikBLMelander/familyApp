spring:
  application:
    name: familyapp-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/familyapp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&autoReconnect=true&failOverReadOnly=false&maxReconnects=10&initialTimeout=2&connectTimeout=60000&socketTimeout=60000}
    username: ${SPRING_DATASOURCE_USERNAME:familyapp}
    password: ${SPRING_DATASOURCE_PASSWORD:familyapp}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 60000
      maximum-pool-size: 10
      minimum-idle: 2
      connection-test-query: SELECT 1
      validation-timeout: 5000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    connect-retries: 10
    connect-retries-interval: 5

server:
  port: ${SERVER_PORT:8080}

# Cache logging (uncomment to see cache hits/misses in logs)
# logging:
#   level:
#     org.springframework.cache: DEBUG

logging:
  level:
    root: INFO
    org.springframework.web.cors: DEBUG
    org.springframework.web.filter: DEBUG
    org.springframework.cache: DEBUG  # Enable cache logging to see hits/misses
    com.familyapp: DEBUG  # Enable debug logging for our application
    org.hibernate: WARN  # Reduce Hibernate noise
    org.springframework.transaction: DEBUG  # See transaction boundaries

kidquest:
  email:
    # Resend. Unset means reset e-mails are logged and not sent, which keeps local
    # development working without credentials -- and is why the service never treats a
    # successful call as proof that mail arrived.
    api-key: ${RESEND_API_KEY:}
    from: ${KIDQUEST_EMAIL_FROM:KidQuest <no-reply@kidquest.se>}
  password-reset:
    # Where the emailed link lands. A web page rather than a deep link on purpose: the
    # person who needs it most is locked out, possibly on a laptop, possibly without the
    # app installed at all.
    url-base: ${KIDQUEST_PASSWORD_RESET_URL:https://familyapp-frontend-production.up.railway.app/aterstall-losenord}
  subscription:
    # The value RevenueCat sends verbatim as the Authorization header. Unset means the
    # webhook refuses every call, which is the safe failure: no purchase gets through,
    # rather than anyone being able to grant themselves one.
    webhook-secret: ${KIDQUEST_SUBSCRIPTION_WEBHOOK_SECRET:}
    # Sandbox purchases apply to entitlement, so a Play licence tester can exercise the
    # whole chain. Turn this off before launch.
    accept-sandbox: ${KIDQUEST_SUBSCRIPTION_ACCEPT_SANDBOX:true}
